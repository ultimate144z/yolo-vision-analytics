name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `streamlit run src/dashboard/app.py`
        2. Upload a video file
        3. Click 'Start Detection'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, GPU info
      placeholder: |
        - OS: Ubuntu 22.04
        - Python: 3.10
        - GPU: NVIDIA RTX 3060 / None (CPU)
        - CUDA: 12.1 / N/A
    validations:
      required: false
